---
name: Update BSA Calendar
on:
  # manual trigger
  workflow_dispatch: {}
  schedule:
    # hourly at minute 42 between 7 and 23 o'clock
    - cron: "42 7-23 * * *"
jobs:
  update_data:
    name: Rebuild BSA calendar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: gh-pages
          path: gh-pages

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Render BSA table
        env:
          GOOGLE_SPREADSHEET_API: ${{ secrets.GOOGLE_SPREADSHEET_API }}
        run: |
          go run bsa-cal/main.go

      - name: Copy updates
        run: |
          cp bsa-style.css bsa-schedule.html gh-pages/

      - name: Push updates
        run: |
          cd gh-pages

          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add bsa-schedule.html bsa-style.css

          set +e
          git commit -m "Update BSA calendar"
          if [ $? -eq 0 ]; then
            set -e
            git push origin gh-pages
          else
            echo "Files up to date"
          fi

      - name: Notify Microsoft Teams on failure
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > teams-payload.json <<EOF
          {
            "status": "failure",
            "workflow": "${GITHUB_WORKFLOW}",
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF_NAME}",
            "triggeredBy": "${GITHUB_ACTOR}",
            "runUrl": "${RUN_URL}",
            "summary": "Workflow ${GITHUB_WORKFLOW} failed in ${GITHUB_REPOSITORY}"
          }
          EOF

          curl -sS -f -H 'Content-Type: application/json' \
            -d @teams-payload.json \
            "$TEAMS_WEBHOOK_URL"
